<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test mod EmulatorJS</title>
</head>
<body>
<select id="core">
  <option value="nes">NES</option>
  <option value="snes">SNES</option>
  <option value="arcade">Arcade</option>
  <option value="segaMD">Sega MD</option>
  <option value="gba">GBA</option>
  <option value="gb">GB/GBC</option>
  <option value="n64">N64</option>
  <option value="psx">PS1</option>
  <option value="nds">NDS</option>
</select>
<input type="file" id="rom">
<button onclick="play()">Chơi</button>
  <div style="width: 640px; height: 480px; max-width: 100%;">
  <div id="game"></div>
  </div>
<!-- Chi cho khung game co kich thuoc de hien hinh — day khong phai CSS mod (khong doi mau nut, volume, menu). Khong co dong nay thi khung game cao 0px nên chi nghe tiếng, không thấy hình. -->
<script>
  function play() {
    window.EJS_player = '#game';
    window.EJS_core = document.getElementById('core').value;
    window.EJS_gameUrl = URL.createObjectURL(document.getElementById('rom').files[0]);
    window.EJS_pathtodata = './';
    window.EJS_startOnLoaded = true;
    const s = document.createElement('script');
    s.src = './loader.js';
    document.body.appendChild(s);
  }
</script>
</body>
</html>
