
name: Sync EmulatorJS (chon loc)

on:
  push:
    paths:
      - "apply-emulatorjs-mods.py"
      - ".github/workflows/sync-emulatorjs.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force_sync:
        description: "Bat buoc dong bo lai du ben goc khong doi (dung khi doi script mod / mau nut)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo cua Hai
        uses: actions/checkout@v4

      - name: Checkout EmulatorJS goc (chi lay data/)
        uses: actions/checkout@v4
        with:
          repository: EmulatorJS/EmulatorJS
          path: upstream
          sparse-checkout: |
            data
          sparse-checkout-cone-mode: false

      - name: Kiem tra co can dong bo khong
        run: |
          UPSTREAM_VERSION=$(jq -r .version upstream/data/version.json)
          UPSTREAM_SHA=$(cd upstream && git rev-parse HEAD)
          echo "UPSTREAM_VERSION=$UPSTREAM_VERSION" >> $GITHUB_ENV
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
          echo "Ban goc: $UPSTREAM_VERSION, commit: $UPSTREAM_SHA"
          echo "Ban da luu: $(cat .upstream-version 2>/dev/null || echo chua-co), commit: $(cat .upstream-sha 2>/dev/null || echo chua-co)"
          NEEDS_SYNC=false
          if [ "$UPSTREAM_SHA" != "$(cat .upstream-sha 2>/dev/null || echo '')" ]; then
            echo "Ly do: ben goc co thay doi."
            NEEDS_SYNC=true
          fi
          if [ "${{ inputs.force_sync }}" = "true" ]; then
            echo "Ly do: Hai bat buoc dong bo lai."
            NEEDS_SYNC=true
          fi
          mkdir -p /tmp/modcheck/src
          cp upstream/data/src/frontend.js upstream/data/src/emulator.js upstream/data/src/gamepad.js /tmp/modcheck/src/ 2>/dev/null || true
          cp upstream/data/emulator.css /tmp/modcheck/ 2>/dev/null || true
          MOD_MISSING=false
          for f in src/frontend.js src/emulator.js src/gamepad.js emulator.css; do
            if [ "$f" = "emulator.css" ]; then copy="/tmp/modcheck/emulator.css"; else copy="/tmp/modcheck/src/$(basename "$f")"; fi
            if [ ! -f "$copy" ]; then MOD_MISSING=true; continue; fi
            if ! python3 apply-emulatorjs-mods.py "$copy" >/dev/null 2>&1; then
              MOD_MISSING=true
            else
              cmp -s "$copy" "$f" || MOD_MISSING=true
            fi
          done
          if [ "$MOD_MISSING" = "true" ]; then
            echo "Ly do: mod cua Hai chua co trong code hien tai (file goc + script khac voi file hien tai)."
            NEEDS_SYNC=true
          fi
          if [ ! -d cores/reports ] || [ -z "$(ls -A cores/reports 2>/dev/null)" ]; then
            echo "Ly do: chua co cores/reports/ trong repo."
            NEEDS_SYNC=true
          fi
          echo "NEEDS_SYNC=$NEEDS_SYNC" >> $GITHUB_ENV
          if [ "$NEEDS_SYNC" = "false" ]; then
            echo "Khong can dong bo — dung o day, khong mo PR."
          fi

      - name: Copy nguyen thu muc data/ ve goc repo
        if: env.NEEDS_SYNC == 'true'
        run: |
          cp -r upstream/data/. ./
          echo "$UPSTREAM_VERSION" > .upstream-version
          echo "$UPSTREAM_SHA" > .upstream-sha
          rm -rf vendor upstream
          echo "Da copy xong, ban goc: $UPSTREAM_VERSION"
          ls -la

      - name: Tu dong them lai nut PS1 + NES Turbo + ky hieu tay cam + mau nut + tat menu tu mo
        if: env.NEEDS_SYNC == 'true'
        run: |
          python3 apply-emulatorjs-mods.py src/frontend.js
          python3 apply-emulatorjs-mods.py src/gamepad.js
          python3 apply-emulatorjs-mods.py src/emulator.js
          python3 apply-emulatorjs-mods.py emulator.css
          node --check src/frontend.js
          node --check src/gamepad.js
          node --check src/emulator.js

      - name: Tai day du core ve tu host (khong phu thuoc CDN)
        if: env.NEEDS_SYNC == 'true'
        run: |
          mkdir -p cores
          cd cores
          curl -s "https://cdn.emulatorjs.org/stable/data/cores/" | grep -o 'href="[^"]*-wasm\.data"' | sed 's/href="//;s/"//' | sort -u > /tmp/core-files.txt
          wc -l /tmp/core-files.txt
          while read -r f; do
            curl -fL -o "$f" "https://cdn.emulatorjs.org/stable/data/cores/$f" || echo "Khong tai duoc $f"
          done < /tmp/core-files.txt
          ls | wc -l
          du -sh .
          mkdir -p reports
          cd reports
          curl -s "https://cdn.emulatorjs.org/stable/data/cores/reports/" | grep -o 'href="[^"]*\.json"' | sed 's/href="//;s/"//' | sort -u > /tmp/report-files.txt
          wc -l /tmp/report-files.txt
          while read -r f; do
            curl -fL -o "$f" "https://cdn.emulatorjs.org/stable/data/cores/reports/$f" || echo "Khong tai duoc $f"
          done < /tmp/report-files.txt
          ls | wc -l

      - name: Mo PR neu co thay doi
        id: cpr
        if: env.NEEDS_SYNC == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Sync EmulatorJS ${{ env.UPSTREAM_VERSION }} (chon loc, giu mod nut bam)"
          body: |
            Dong bo tu EmulatorJS/EmulatorJS — copy nguyen thu muc data/ ve goc repo.
            - Bo nguon nam thang o goc repo: loader.js, emulator.css,
              version.json, src/, src/vendor/, compression/, localization/, cores/
            - Khong copy: index.html goc, build.js, docs/, package.json
            - Da xoa vendor/ cu va thu muc upstream (submodule rong)
            - Da chay apply-emulatorjs-mods.py: them lai PS1 L/R + NES Turbo
            - Da tai day du core (187 file, ~283MB) ve cores/ de tu host, khong phu thuoc CDN
            - PR nay tu dong gop vao main (xem buoc sau).
          branch: sync/emulatorjs-${{ env.UPSTREAM_VERSION }}
          commit-message: "Sync EmulatorJS ${{ env.UPSTREAM_VERSION }} (selective)"

      - name: Tu dong gop PR vao main
        if: env.NEEDS_SYNC == 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Tu dong gop PR #${{ steps.cpr.outputs.pull-request-number }}"
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --merge --delete-branch
          echo "Da gop xong vao main."
