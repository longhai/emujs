# Sync EmulatorJS — bo nguon nam thang o goc repo cua Hai
# Dat file nay vao: .github/workflows/sync-emulatorjs.yml trong repo cua Hai
# Chay: tu dong moi tuan (chu nhat) + bam nut Run workflow bat cu luc nao
#
# BO CUC PHANG, KHONG LONG NHAU — Hai chot 05/11:
# Bo nguon EmulatorJS nam thang o goc repo, nhu cua chinh Hai, khong
# nam trong vendor/emulatorjs-data/ nua:
#   loader.js, emulator.css, version.json, src/, localization/, cores/
#   o thang goc repo. Trang choi cua Hai chi can tro EJS_pathtodata ve
#   goc repo nay la chay, khong qua nhieu thu muc.
# Thu muc 'upstream' mau xanh tren GitHub la ban checkout tam cua repo
# goc, no chi la con tro submodule rong, khong co file that — workflow
# xoa no di truoc khi mo PR, khong de no len kho nua.
# Thu muc vendor/ cu (ban sync truoc) cung duoc xoa trong PR nay.
#
# MAPPING (goc -> goc repo cua Hai):
#   data/loader.js            -> loader.js
#   data/emulator.css         -> emulator.css
#   data/version.json         -> version.json
#   data/src/*.js             -> src/*.js
#   data/localization/*       -> localization/*
#   index.html (goc)          -> KHONG COPY
#   build.js, docs/, package.json, serve.py, update.js -> KHONG COPY
#   LICENSE goc               -> KHONG COPY de (giu LICENSE cua Hai)
# Sau khi sync xong, trang choi cua Hai chi can:
#   EJS_pathtodata: "./" (neu trang nam cung repo) hoac duong dan
#   toi goc repo nay (vd GitHub Pages cua repo emujs).
#
# Cach giu sua thang vao file goc (PS1 L/R + NES Turbo + tay cam):
#   apply-emulatorjs-mods.py tim neo trong src/frontend.js va
#   src/gamepad.js roi chen lai nut mod. Chay lai khong them trung.
#   Tim khong thay neo -> workflow DUNG, khong mo PR ghi de.

name: Sync EmulatorJS (chon loc)

on:
  schedule:
    - cron: "0 3 * * 0"  # chu nhat 03:00 UTC, kiem tra ban moi
  workflow_dispatch:  # cho phep bam tay

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo cua Hai
        uses: actions/checkout@v4

      - name: Checkout EmulatorJS goc (chi lay data/)
        uses: actions/checkout@v4
        with:
          repository: EmulatorJS/EmulatorJS
          path: upstream
          sparse-checkout: |
            data
          sparse-checkout-cone-mode: false

      - name: Ghi nho ban goc dang dung
        run: |
          cat upstream/data/version.json
          echo "UPSTREAM_VERSION=$(jq -r .version upstream/data/version.json)" >> $GITHUB_ENV

      - name: Copy bo nguon ve thang goc repo
        run: |
          # ALLOWLIST — chi nhung file nay moi duoc cap nhat theo goc.
          cp upstream/data/loader.js ./
          cp upstream/data/emulator.css ./
          cp upstream/data/version.json ./
          mkdir -p src localization
          cp upstream/data/src/*.js src/
          cp -r upstream/data/localization/. localization/
          # Ghi ban goc de lan sau so sanh
          echo "$UPSTREAM_VERSION" > .upstream-version
          # Xoa bo cuc cu + thu muc tam, khong de len PR:
          # - vendor/ : bo cuc long nhau cua ban sync truoc
          # - upstream/ : checkout tam, tren GitHub no hien thanh
          #   thu muc xanh (submodule) rong, khong co file that
          rm -rf vendor upstream
          echo "Da copy xong, ban goc: $UPSTREAM_VERSION"
          ls -la

      # Tai code goc moi ve xong, tu dong them lai nut mod.
      # Script tim neo trong src/frontend.js, chen PS1 L/R + NES Turbo,
      # chay lai khong them trung. Tim khong thay neo -> loi, dung.
      - name: Tu dong them lai nut PS1 + NES Turbo + ky hieu tay cam
        run: |
          python3 apply-emulatorjs-mods.py src/frontend.js
          python3 apply-emulatorjs-mods.py src/gamepad.js
          node --check src/frontend.js
          node --check src/gamepad.js

      # Tu host DAY DU core — Hai chot 05/11: lay het, khong phu thuoc CDN luc choi.
      # Luc sync, workflow doc danh sach tren CDN roi tai het ve repo
      # (05/11: 187 file, tong ~283MB — 46 core ban thuong + 46 legacy +
      # 48 thread + 47 thread-legacy, gom ca ppsspp/dosbox_pure chi co ban
      # thread; file lon nhat fbneo ~8MB, moi file deu <100MB nen GitHub
      # cho luu). Sau do trang choi nap core tu repo cua Hai, khong goi CDN nua.
      # Lay danh sach dong tu trang index cua CDN, co core moi la tu co, khong
      # can sua lai workflow.
      - name: Tai day du core ve tu host (khong phu thuoc CDN)
        run: |
          mkdir -p cores
          cd cores
          curl -s "https://cdn.emulatorjs.org/stable/data/cores/" | grep -o 'href="[^"]*-wasm\.data"' | sed 's/href="//;s/"//' | sort -u > /tmp/core-files.txt
          wc -l /tmp/core-files.txt
          while read -r f; do
            curl -fL -o "$f" "https://cdn.emulatorjs.org/stable/data/cores/$f" || echo "Khong tai duoc $f"
          done < /tmp/core-files.txt
          ls | wc -l
          du -sh .

      - name: Mo PR neu co thay doi
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Sync EmulatorJS ${{ env.UPSTREAM_VERSION }} (chon loc, giu mod nut bam)"
          body: |
            Dong bo co chon loc tu EmulatorJS/EmulatorJS.
            - Bo nguon nam thang o goc repo: loader.js, emulator.css,
              version.json, src/*.js, localization/, cores/
            - Khong copy: index.html goc, build.js, docs/, package.json
            - Da xoa vendor/ cu va thu muc upstream (submodule rong)
            - Da chay apply-emulatorjs-mods.py: them lai PS1 L/R + NES Turbo
            - Da tai day du core (187 file, ~283MB) ve cores/ de tu host, khong phu thuoc CDN
            - Kiem tra ky phan nut bam truoc khi gop.
          branch: sync/emulatorjs-${{ env.UPSTREAM_VERSION }}
          commit-message: "Sync EmulatorJS ${{ env.UPSTREAM_VERSION }} (selective)"
